id: general-policies-state-machine
stateData: GeneralPoliciesStateData
projections:
  - GeneralPolicyTextProjector
  - TopicPolicyTextProjector
events:
  GeneralPolicyAddedV1:
    preEventValidators:
      - GeneralPolicyMustNotExistValidator
  GeneralPolicyUpdatedV1:
    preEventValidators:
      - GeneralPolicyMustExistValidator
  GeneralPolicyRemovedV1:
    preEventValidators:
      - GeneralPolicyMustExistValidator
  TopicCreatedV1:
    preEventValidators:
      - TopicMustNotExistValidator
  TopicUpdatedV1:
    preEventValidators:
      - TopicMustExistValidator
  TopicRemovedV1:
    preEventValidators:
      - TopicMustExistValidator
  TopicPolicyAddedV1:
    preEventValidators:
      - TopicMustExistValidator
      - TopicPolicyMustNotExistValidator
  TopicPolicyUpdatedV1:
    preEventValidators:
      - TopicMustExistValidator
      - TopicPolicyMustExistValidator
  TopicPolicyRemovedV1:
    preEventValidators:
      - TopicMustExistValidator
      - TopicPolicyMustExistValidator
