id: general-policies-state-machine
stateData: GeneralPoliciesStateData
initializationEvents:
  - GeneralPolicyAddedV1
  - TopicCreatedV1
  - AgentFamilyCreatedV1
projections:
  - GeneralPolicyTextProjector
  - TopicPolicyTextProjector
  - AgentFamilyPolicyTextProjector
events:
  GeneralPolicyAddedV1:
    preEventValidators:
      - GeneralPolicyMustNotExistValidator
  GeneralPolicyUpdatedV1:
    preEventValidators:
      - GeneralPolicyMustExistValidator
  GeneralPolicyRemovedV1:
    preEventValidators:
      - GeneralPolicyMustExistValidator
  TopicCreatedV1:
    preEventValidators:
      - TopicMustNotExistValidator
  TopicUpdatedV1:
    preEventValidators:
      - TopicMustExistValidator
  TopicRemovedV1:
    preEventValidators:
      - TopicMustExistValidator
  TopicPolicyAddedV1:
    preEventValidators:
      - TopicMustExistValidator
      - TopicPolicyMustNotExistValidator
  TopicPolicyUpdatedV1:
    preEventValidators:
      - TopicMustExistValidator
      - TopicPolicyMustExistValidator
  TopicPolicyRemovedV1:
    preEventValidators:
      - TopicMustExistValidator
      - TopicPolicyMustExistValidator
  AgentFamilyCreatedV1:
    preEventValidators:
      - AgentFamilyMustNotExistValidator
  AgentFamilyUpdatedV1:
    preEventValidators:
      - AgentFamilyMustExistValidator
  AgentFamilyRemovedV1:
    preEventValidators:
      - AgentFamilyMustExistValidator
  AgentFamilyPolicyAddedV1:
    preEventValidators:
      - AgentFamilyMustExistValidator
      - AgentFamilyPolicyMustNotExistValidator
  AgentFamilyPolicyUpdatedV1:
    preEventValidators:
      - AgentFamilyMustExistValidator
      - AgentFamilyPolicyMustExistValidator
  AgentFamilyPolicyRemovedV1:
    preEventValidators:
      - AgentFamilyMustExistValidator
      - AgentFamilyPolicyMustExistValidator
