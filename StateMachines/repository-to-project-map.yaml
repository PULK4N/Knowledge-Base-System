id: repository-to-project-map-state-machine
stateData: RepositoryToProjectMapStateData
initializationEvents:
  - RepositoryToProjectMapAddedV1
events:
  RepositoryToProjectMapAddedV1:
    preEventValidators:
      - RepositoryMappingMustNotExistValidator
  RepositoryToProjectMapRemovedV1:
    preEventValidators:
      - RepositoryMappingMustExistValidator
