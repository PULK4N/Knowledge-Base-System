id: skills-state-machine
stateData: SkillStateData
initializationEvents:
  - SkillCreatedV1
  - SkillCreatedV2
projections:
  - SkillSummaryProjector
  - SkillListProjector
  - SkillSearchProjector
events:
  SkillCreatedV1:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillCreatedV2:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillUpdatedV1:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillDetailsUpdatedV1:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillDeletedV1:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillReferenceAddedV1:
    preEventValidators:
      - SkillReferenceMustNotExistValidator
  SkillReferenceAddedV2:
    preEventValidators:
      - SkillReferenceMustNotExistValidator
  SkillReferenceUpdatedV1:
    preEventValidators:
      - SkillReferenceMustExistValidator
  SkillReferenceUpdatedV2:
    preEventValidators:
      - SkillReferenceMustExistValidator
  SkillReferenceAutoLoadUpdatedV1:
    preEventValidators:
      - SkillReferenceMustExistValidator
  SkillReferenceDeletedV1:
    preEventValidators:
      - SkillReferenceMustExistValidator
  SkillAttachmentAddedV1:
    preEventValidators:
      - SkillAttachmentMustNotExistValidator
  SkillAttachmentDeletedV1:
    preEventValidators:
      - SkillAttachmentMustExistValidator
