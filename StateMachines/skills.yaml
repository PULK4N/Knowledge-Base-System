id: skills-state-machine
stateData: SkillStateData
events:
  SkillCreatedV1:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillUpdated:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillDetailsUpdated:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillDeleted:
    uniqueConstraints:
      - UniqueSkillNameConstraint
  SkillReferenceAdded:
    preEventValidators:
      - SkillReferenceMustNotExistValidator
  SkillReferenceUpdated:
    preEventValidators:
      - SkillReferenceMustExistValidator
  SkillReferenceDeleted:
    preEventValidators:
      - SkillReferenceMustExistValidator
