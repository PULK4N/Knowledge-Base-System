id: features-state-machine
stateData: FeatureStateData
initializationEvents:
  - FeatureAddedV1
projections:
  - FeatureSummaryProjector
  - FeatureSearchProjector
  - FeatureResearchSearchProjector
events:
  FeatureAddedV1:
    uniqueConstraints:
      - UniqueFeatureNameConstraint
  FeatureRemovedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
    uniqueConstraints:
      - UniqueFeatureNameConstraint
  FeatureStatusUpdatedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
  FeatureSkillAddedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureSkillMustNotExistValidator
  FeatureSkillRemovedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureSkillMustExistValidator
  FeatureRecordAddedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureRecordMustNotExistValidator
  FeatureRecordUpdatedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureRecordMustExistValidator
  FeatureRecordRemovedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureRecordMustExistValidator
  FeatureResearchDiscoveryAddedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureResearchDiscoveryMustNotExistValidator
  FeatureResearchDiscoveryAddedV2:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureResearchDiscoveryMustNotExistValidator
  FeatureResearchDiscoveryUpdatedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureResearchDiscoveryMustExistValidator
  FeatureResearchDiscoveryUpdatedV2:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureResearchDiscoveryMustExistValidator
  FeatureResearchDiscoveryRemovedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeatureResearchDiscoveryMustExistValidator
  FeaturePlanAddedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeaturePlanMustNotExistValidator
  CurrentFeaturePlanUpdatedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - CurrentFeaturePlanMustExistValidator
  CurrentFeaturePlanChangedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeaturePlanMustExistValidator
  FeaturePlanRemovedV1:
    preEventValidators:
      - FeatureMustBeActiveValidator
      - FeaturePlanMustExistValidator
