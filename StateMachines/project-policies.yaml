id: project-policies-state-machine
stateData: ProjectPoliciesStateData
initializationEvents:
  - ProjectCreatedV1
  - ProjectCreatedV2
projections:
  - ProjectPolicyTextProjector
  - ProjectTopicProjector
  - PolicyProjectSummaryProjector
events:
  ProjectCreatedV1:
    preEventValidators:
      - ProjectMustNotExistValidator
    uniqueConstraints:
      - UniqueProjectNameConstraint
  ProjectCreatedV2:
    preEventValidators:
      - ProjectMustNotExistValidator
    uniqueConstraints:
      - UniqueProjectNameConstraint
  ProjectUpdatedV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
    uniqueConstraints:
      - UniqueProjectNameConstraint
  ProjectUpdatedV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
    uniqueConstraints:
      - UniqueProjectNameConstraint
  ProjectDeletedV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
    uniqueConstraints:
      - UniqueProjectNameConstraint
  ProjectDeletedV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
    uniqueConstraints:
      - UniqueProjectNameConstraint
  RepositoryAddedToProjectV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectRepositoryMustNotExistValidator
  RepositoryAddedToProjectV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectRepositoryMustNotExistValidator
  ProjectPolicyAddedV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectPolicyMustNotExistValidator
  ProjectPolicyAddedV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectPolicyMustNotExistValidator
  ProjectPolicyUpdatedV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectPolicyMustExistValidator
  ProjectPolicyUpdatedV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectPolicyMustExistValidator
  ProjectPolicyRemovedV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectPolicyMustExistValidator
  ProjectPolicyRemovedV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectPolicyMustExistValidator
  TopicRelationAddedToProjectV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectTopicMustNotExistValidator
  TopicRelationAddedToProjectV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectTopicMustNotExistValidator
  TopicRelationRemovedFromProjectV1:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectTopicMustExistValidator
  TopicRelationRemovedFromProjectV2:
    preEventValidators:
      - ProjectMustBeActiveValidator
      - ProjectTopicMustExistValidator
