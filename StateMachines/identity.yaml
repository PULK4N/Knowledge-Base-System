id: identity-state-machine
stateData: AccountStateData
initializationEvents:
  - AdministratorCreatedV1
  - AgentCreatedV1
events:
  AdministratorCreatedV1:
    preEventValidators:
      - AccountMustNotExistValidator
      - UserNameRequiredValidator
  AdministratorPasswordChangedV1:
    preEventValidators:
      - AccountMustNotBeAgentValidator
  AgentCreatedV1:
    preEventValidators:
      - AccountMustNotExistValidator
      - UserNameRequiredValidator
      - KnownPermissionsValidator
  AgentPermissionsSetV1:
    preEventValidators:
      - AccountMustBeAgentValidator
      - KnownPermissionsValidator
