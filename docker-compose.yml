services:
  api:
    build:
      context: .
      dockerfile: API/API/Dockerfile
    container_name: skill-memory-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ApplicationDatabase: Host=postgres;Port=5432;Database=skill_memory;Username=skill_memory;Password=skill_memory
      MemoryEmbeddings__BaseUrl: http://ollama:11434
      MemoryEmbeddings__Model: qwen3-embedding:0.6b
      MemoryEmbeddings__Dimensions: 1024
    ports:
      - "5231:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully

  postgres:
    image: pgvector/pgvector:pg16
    container_name: skill-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skill_memory
      POSTGRES_USER: skill_memory
      POSTGRES_PASSWORD: skill_memory
    ports:
      - "5432:5432"
    volumes:
      - skill-memory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U skill_memory -d skill_memory
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: skill-memory-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - skill-memory-ollama-data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: skill-memory-ollama-model-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - ollama
    command:
      - pull
      - qwen3-embedding:0.6b

volumes:
  skill-memory-postgres-data:
  skill-memory-ollama-data:
