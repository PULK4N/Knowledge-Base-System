services:
  api:
    build:
      context: .
      dockerfile: API/API/Dockerfile
    container_name: skill-memory-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ApplicationDatabase: Host=postgres;Port=5432;Database=skill_memory;Username=skill_memory;Password=skill_memory
      Embeddings__BaseUrl: http://ollama:11434
      Embeddings__Model: qwen3-embedding:0.6b
      Embeddings__Dimensions: 1024
    ports:
      - "5231:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully

  postgres:
    image: pgvector/pgvector:pg16
    container_name: skill-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skill_memory
      POSTGRES_USER: skill_memory
      POSTGRES_PASSWORD: skill_memory
    ports:
      - "5432:5432"
    volumes:
      - skill-memory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U skill_memory -d skill_memory
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: skill-memory-pgweb
    restart: unless-stopped
    environment:
      PGWEB_DATABASE_URL: postgres://skill_memory:skill_memory@postgres:5432/skill_memory?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - nc
        - -vz
        - 127.0.0.1
        - "8081"
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: skill-memory-ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    entrypoint:
      - /bin/sh
      - /usr/local/bin/ollama-gpu-entrypoint.sh
    command:
      - serve
    ports:
      - "11435:11434"
    volumes:
      - skill-memory-ollama-data:/root/.ollama
      - ./scripts/ollama-gpu-entrypoint.sh:/usr/local/bin/ollama-gpu-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/ollama-gpu-ready && ollama list
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: skill-memory-ollama-model-init
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - ollama
    command:
      - pull
      - qwen3-embedding:0.6b

volumes:
  skill-memory-postgres-data:
  skill-memory-ollama-data:
