<form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
  <fieldset [disabled]="submitting">
    <div class="form-field">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" formControlName="newPassword" />
    </div>

    <div class="form-field">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" formControlName="confirmPassword" />
    </div>

    @if (form.errors?.['newPassword']; as passwordError) {
      @if (form.controls.newPassword.touched || form.controls.confirmPassword.touched) {
        <p class="field-error" role="alert">{{ passwordError }}</p>
      }
    }

    <button type="submit" [disabled]="submitting">
      {{ submitting ? 'Saving…' : 'Save and log in' }}
    </button>
  </fieldset>
</form>
