<div class="feature-plan-content">
  @if (plan().contentType === 'Markdown') {
    <app-markdown-content
      [blocks]="emptyBlocks"
      [markdown]="plan().content"
      emptyMessage="This plan has no content."
    />
  } @else {
    @if (plan().content.trim()) {
      <div class="html-plan-preview">
        <iframe
          class="html-plan"
          [title]="'HTML plan: ' + plan().title"
          tabindex="-1"
          sandbox=""
          referrerpolicy="no-referrer"
          [srcdoc]="sandboxedHtmlDocument()"
        ></iframe>
        <button
          type="button"
          class="html-plan-open"
          [attr.aria-label]="'Open ' + plan().title + ' in a new tab'"
          (click)="openHtmlPlanInNewTab()"
        >
          <span>Open in new tab <span aria-hidden="true">↗</span></span>
        </button>
      </div>
    } @else {
      <div class="empty-content">This plan has no content.</div>
    }
  }
</div>
