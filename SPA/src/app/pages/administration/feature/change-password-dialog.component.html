<button class="secondary-button" type="button" aria-haspopup="dialog" (click)="open()">
  Change Admin Password
</button>

@if (state$ | async; as state) {
  @if (state.status !== 'closed') {
    <div class="backdrop" (click)="close()"></div>
    <section class="dialog surface-card" role="dialog" aria-modal="true" aria-labelledby="change-password-heading"
      (keydown.escape)="close()">
      <h2 id="change-password-heading">Change Admin Password</h2>
      @if (state.status === 'saved') {
        <p class="result success" role="status">The admin password was changed.</p>
        <div class="actions">
          <button type="button" (click)="close()">Close</button>
        </div>
      } @else {
        <app-change-password-form
          [saving]="state.status === 'saving'"
          (changeRequested)="change($event)"
          (cancelled)="close()"
        />
        @if (state.status === 'error') {
          <p class="result error" role="alert">{{ state.message }}</p>
        }
      }
    </section>
  }
}
