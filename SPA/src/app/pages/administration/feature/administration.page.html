<header>
  <p class="eyebrow">Operations</p>
  <h1 class="page-heading">Administration</h1>
  <p class="page-subtitle">
    Manage projection processing, inspect queued outbox work, and open the
    database and queue consoles
  </p>
</header>

<nav class="administration-tabs" role="tablist" aria-label="Administration">
  <a
    role="tab"
    id="projections-tab"
    aria-controls="administration-panel"
    routerLink="projections"
    routerLinkActive="active"
    #projectionsLink="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-selected]="projectionsLink.isActive"
  >
    Projections
  </a>
  <a
    role="tab"
    id="projection-runner-tab"
    aria-controls="administration-panel"
    routerLink="projection-runner"
    routerLinkActive="active"
    #projectionRunnerLink="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-selected]="projectionRunnerLink.isActive"
  >
    Run projection
  </a>
  <a
    role="tab"
    id="outbox-tab"
    aria-controls="administration-panel"
    routerLink="outbox"
    routerLinkActive="active"
    #outboxLink="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-selected]="outboxLink.isActive"
  >
    Outbox
  </a>
  <a
    role="tab"
    id="database-tab"
    aria-controls="administration-panel"
    routerLink="database"
    routerLinkActive="active"
    #databaseLink="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-selected]="databaseLink.isActive"
  >
    Database
  </a>
  <a
    role="tab"
    id="queues-tab"
    aria-controls="administration-panel"
    routerLink="queues"
    routerLinkActive="active"
    #queuesLink="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [attr.aria-selected]="queuesLink.isActive"
  >
    Queues
  </a>
</nav>

<section id="administration-panel" role="tabpanel">
  <router-outlet />
</section>
