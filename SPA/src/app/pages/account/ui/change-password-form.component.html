<form [formGroup]="form" (ngSubmit)="submit()">
  <fieldset [disabled]="saving">
    <div class="form-field">
      <label for="current-password">Current password</label>
      <input id="current-password" type="password" autocomplete="current-password" formControlName="currentPassword" />
      @if (form.controls.currentPassword.invalid && form.controls.currentPassword.touched) {
        <p class="field-error" role="alert">Enter your current password.</p>
      }
    </div>

    <div class="form-field">
      <label for="change-new-password">New password</label>
      <input id="change-new-password" type="password" autocomplete="new-password" formControlName="newPassword" />
    </div>

    <div class="form-field">
      <label for="change-confirm-password">Confirm password</label>
      <input id="change-confirm-password" type="password" autocomplete="new-password" formControlName="confirmPassword" />
    </div>

    @if (form.errors?.['newPassword']; as passwordError) {
      @if (form.controls.newPassword.touched || form.controls.confirmPassword.touched) {
        <p class="field-error" role="alert">{{ passwordError }}</p>
      }
    }

    <div class="form-actions">
      <button type="button" class="secondary" (click)="cancelled.emit()">Cancel</button>
      <button type="submit" [disabled]="saving">{{ saving ? 'Saving…' : 'Change password' }}</button>
    </div>
  </fieldset>
</form>
