<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Knowledge Base System home">
      <svg class="brand-mark" viewBox="0 0 52 52" aria-hidden="true">
        <path d="M10 12 26 21m0 0 15-8M26 21v16m0 0-17 4m17-4 16 4" />
        <circle cx="9" cy="11" r="5" />
        <circle cx="43" cy="11" r="5" />
        <circle cx="26" cy="21" r="5" />
        <circle cx="8" cy="42" r="5" />
        <circle cx="43" cy="42" r="5" />
      </svg>
      <span>Knowledge Base<br />System</span>
    </a>

    <nav class="navigation" aria-label="Primary navigation">
      <a
        class="nav-item"
        routerLink="/skills"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 3l-4 18" />
        </svg>
        <span>Skills</span>
      </a>
      <a
        class="nav-item"
        routerLink="/policies"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 4.5 6v5.5c0 4.7 3.2 8.1 7.5 9.5 4.3-1.4 7.5-4.8 7.5-9.5V6L12 3Z" />
        </svg>
        <span>Policies</span>
      </a>
      <a
        class="nav-item"
        routerLink="/features"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 5h14v14H5zM9 9h6M9 13h6M9 17h4" />
        </svg>
        <span>Features</span>
      </a>
      <a
        class="nav-item"
        routerLink="/memories"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="6" rx="8" ry="3" />
          <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" />
        </svg>
        <span>Memories</span>
      </a>
      <a
        class="nav-item"
        routerLink="/administration"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M10 14v6" />
          <circle cx="14" cy="7" r="2" />
          <circle cx="8" cy="17" r="2" />
        </svg>
        <span>Administration</span>
      </a>
    </nav>
  </aside>

  <main class="workspace">
    <div class="theme-switcher">
      @if (themeToggleState$ | async; as toggleState) {
        <button
          class="theme-toggle"
          type="button"
          [disabled]="toggleState.status === 'updating'"
          [attr.aria-label]="themeToggleLabel()"
          [attr.title]="themeToggleLabel()"
          [attr.aria-pressed]="currentTheme() === 'Dark'"
          (click)="toggleTheme()"
        >
          @if (currentTheme() === 'Dark') {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5 8.5 8.5 0 1 0 20.5 14.7Z" />
            </svg>
          }
          <span class="sr-only">{{ themeToggleLabel() }}</span>
        </button>
        @if (toggleState.status === 'error') {
          <span class="theme-error" role="alert">Could not save theme.</span>
        }
      }
    </div>
    <router-outlet />
  </main>
</div>
