@if (totalCount() > 0) {
  <footer class="pagination-bar">
    <div class="pagination-summary">
      <span>
        Showing {{ firstVisibleItem() }}–{{ lastVisibleItem() }} of
        {{ totalCount() }} {{ label().toLowerCase() }}
      </span>
      @if (pageSizes().length > 0) {
        <label>
          <span>Per page</span>
          <select
            #pageSizeSelect
            [value]="pageSize()"
            (change)="requestPageSize(pageSizeSelect.value)"
          >
            @for (size of pageSizes(); track size) {
              <option [value]="size">{{ size }}</option>
            }
          </select>
        </label>
      }
    </div>
    <nav class="pagination" [attr.aria-label]="label() + ' pagination'">
      <button
        type="button"
        aria-label="Previous page"
        [disabled]="!hasPreviousPage()"
        (click)="requestPage(page() - 1)"
      >
        <span aria-hidden="true">‹</span>
      </button>
      @for (visiblePage of pages(); track visiblePage) {
        <button
          type="button"
          [class.current]="visiblePage === page()"
          [attr.aria-current]="visiblePage === page() ? 'page' : null"
          [attr.aria-label]="'Page ' + visiblePage"
          (click)="requestPage(visiblePage)"
        >
          {{ visiblePage }}
        </button>
      }
      <button
        type="button"
        aria-label="Next page"
        [disabled]="!hasNextPage()"
        (click)="requestPage(page() + 1)"
      >
        <span aria-hidden="true">›</span>
      </button>
    </nav>
  </footer>
}
