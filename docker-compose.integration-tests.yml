services:
  api:
    build:
      context: .
      dockerfile: API/API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ApplicationDatabase: Host=postgres;Port=5432;Database=skill_memory_integration;Username=skill_memory;Password=skill_memory
      Embeddings__BaseUrl: http://ollama:11434
      Embeddings__Model: qwen3-embedding:0.6b
      Embeddings__Dimensions: 1024
    ports:
      - "${MCP_INTEGRATION_API_PORT:-5232}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: skill_memory_integration
      POSTGRES_USER: skill_memory
      POSTGRES_PASSWORD: skill_memory
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U skill_memory -d skill_memory_integration
      interval: 2s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 2s
      timeout: 5s
      retries: 30

  ollama-model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint:
      - ollama
    command:
      - pull
      - qwen3-embedding:0.6b
